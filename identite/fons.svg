<?xml version="1.0" encoding="UTF-8"?>
<!-- Fond d'écran d'OcMintux (bureau et écran de connexion). Converti en PNG
     1920×1080 par « make ». Dessin original, licence GPL-3.0-or-later. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <radialGradient id="ciel" cx="0.72" cy="0.38" r="0.95">
      <stop offset="0" stop-color="#8e1a1f"/>
      <stop offset="0.55" stop-color="#5a1016"/>
      <stop offset="1" stop-color="#2a080c"/>
    </radialGradient>
    <linearGradient id="colinas" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5f8f2e"/>
      <stop offset="1" stop-color="#2f4d17"/>
    </linearGradient>
    <g id="bras">
      <path d="M -30 -24 C -30 -70 -52 -110 -58 -156 C -40 -150 -20 -148 0 -148 C 20 -148 40 -150 58 -156 C 52 -110 30 -70 30 -24 Z"/>
      <circle cx="-58" cy="-172" r="15"/>
      <circle cx="0" cy="-184" r="15"/>
      <circle cx="58" cy="-172" r="15"/>
    </g>
  </defs>
  <rect width="1920" height="1080" fill="url(#ciel)"/>
  <!-- Croix occitane en filigrane, à droite (la gauche reste libre pour les icônes). -->
  <g fill="#f5c842" opacity="0.92" transform="translate(1330 390) scale(1.1)">
    <use href="#bras"/>
    <use href="#bras" transform="rotate(90)"/>
    <use href="#bras" transform="rotate(180)"/>
    <use href="#bras" transform="rotate(270)"/>
    <circle r="34"/>
  </g>
  <!-- Collines vertes : le vert de Linux Mint, les Pyrénées au loin. -->
  <path d="M0 860 C 260 800 420 830 640 790 C 860 750 1000 820 1240 800 C 1480 780 1660 720 1920 760 L1920 1080 L0 1080 Z"
        fill="#7aa83a"/>
  <path d="M0 930 C 300 880 520 920 800 890 C 1080 860 1300 930 1560 900 C 1720 882 1840 870 1920 880 L1920 1080 L0 1080 Z"
        fill="url(#colinas)"/>
  <text x="1330" y="700" text-anchor="middle" font-family="Ubuntu, 'DejaVu Sans', sans-serif"
        font-size="96" font-weight="bold" fill="#f5c842" letter-spacing="4">OcMintux</text>
</svg>
