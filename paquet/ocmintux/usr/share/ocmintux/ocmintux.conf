# Réglages d'OcMintux.
# Après une modification : sudo ocmintux-config, puis redémarrer le PC.

# Langue de l'interface :
#   bearnes = béarnais là où OcMintux a une traduction, sinon occitan, sinon français
#   oc      = occitan (surtout languedocien), avec repli en français
#   fr      = français
LANGUE=oc

# Disposition du clavier :
#   oci    = AZERTY occitan (lettres accentuées occitanes en accès direct)
#   azerty = AZERTY français habituel
#   mac    = clavier Apple français (iMac...), lettres occitanes avec la touche
#            Option de droite : Option+a á, i í, o ó, p ò, u ú
CLAVIER=oci

# Mises à jour automatiques (gestionnaire de mises à jour de Linux Mint :
# Ubuntu, Mint et OcMintux, une fois par jour) : oui ou non
MISES_A_JOUR_AUTO=oui

# Compte des élèves (CP à CM2) : un compte commun, sans mot de passe à
# l'écran de connexion, sans droits d'administration. oui ou non.
# Le compte des enseignants est celui créé à l'installation.
COMPTE_ELEVES=oui
# Identifiant du compte (sans accent ni espace), et nom affiché.
ELEVES_IDENTIFIANT=escolans
ELEVES_NOM="Escolans"

# Filtrage du web pour le compte des élèves, dans Firefox (DNS4EU, protection
# des enfants : sites adultes, malveillants, publicités). Réglage verrouillé :
# les élèves ne peuvent pas le désactiver. oui ou non.
FILTRE_WEB_ELEVES=oui
# Page d'accueil de Firefox pour les élèves.
ACCUEIL_ELEVES=https://www.qwantjunior.com/

# iMac dont le disque dur a été remplacé par un SSD : la sonde du disque
# manque, le ventilateur « HDD » tourne vite pour rien. OcMintux le règle
# d'après les vraies températures (SSD, alimentation, carte graphique,
# processeur) ; les autres ventilateurs restent gérés par le Mac.
#   auto = seulement sur un Mac dont le disque interne est un SSD
#   ssd  = toujours (sur un Mac)
#   non  = jamais, le Mac décide seul
# État : ocmintux-ventilation --etat
VENTILATEUR_DISQUE=auto

# Logiciels à lancer en français en plus de ceux de la liste d'OcMintux
# (/usr/share/ocmintux/applis-en-francais), quand le PC est en occitan :
# noms de fichiers .desktop sans .desktop, séparés par des espaces.
# Exemple : APPLIS_EN_FRANCAIS="org.geogebra.GeoGebra"
APPLIS_EN_FRANCAIS=
